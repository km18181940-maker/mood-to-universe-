<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood to Universe</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #30205c, #090914 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  max-width: 500px;
  width: 100%;
  text-align: center;
}

h1 {
  font-size: 35px;
  margin-bottom: 10px;
}

.subtitle {
  color: #bcb8d9;
  margin-bottom: 30px;
}

.moods {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.mood {
  padding: 18px;
  border: 1px solid #514474;
  border-radius: 15px;
  background: #17152b;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.mood.selected {
  background: #7251db;
  border-color: white;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #a58aff;
  color: #130c29;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 25px;
  border-radius: 20px;
  background: #201a3d;
  border: 1px solid #6953a6;
}

#universe {
  font-size: 55px;
  margin-bottom: 10px;
}

#description {
  color: #ddd5ff;
  line-height: 1.7;
}

</style>
</head>

<body>

<div class="container">

<h1>🌌 Mood to Universe</h1>

<p class="subtitle">
Turn your feelings into a universe.
</p>

<h3>How are you feeling today?</h3>

<div class="moods">

<button class="mood" onclick="selectMood('Happy', this)">
😊 Happy
</button>

<button class="mood" onclick="selectMood('Sad', this)">
🌧️ Sad
</button>

<button class="mood" onclick="selectMood('Angry', this)">
🔥 Angry
</button>

<button class="mood" onclick="selectMood('Calm', this)">
🌿 Calm
</button>

<button class="mood" onclick="selectMood('Lonely', this)">
🌙 Lonely
</button>

<button class="mood" onclick="selectMood('Hopeful', this)">
✨ Hopeful
</button>

</div>

<button onclick="generateUniverse()">
Generate My Universe ✨
</button>

<div id="result">

<div id="universe"></div>

<h2 id="title"></h2>

<p id="description"></p>

</div>

</div>

<script>

let selectedMood = "";

function selectMood(mood, button) {

  selectedMood = mood;

  document.querySelectorAll(".mood").forEach(btn => {
    btn.classList.remove("selected");
  });

  button.classList.add("selected");
}

function generateUniverse() {

  if (selectedMood === "") {
    alert("Please select your mood first!");
    return;
  }

  const universes = {

    Happy: {
      emoji: "☀️🌈",
      title: "The Universe of Sunshine",
      description: "Your universe is full of golden light, colorful galaxies and endless possibilities. Let your happiness shine."
    },

    Sad: {
      emoji: "🌧️🌌",
      title: "The Universe of Rain",
      description: "A quiet universe filled with rain, stars and peaceful galaxies. Even the darkest nights have stars."
    },

    Angry: {
      emoji: "🔥🪐",
      title: "The Universe of Fire",
      description: "Powerful red galaxies and burning stars surround you. Your energy can become strength and change."
    },

    Calm: {
      emoji: "🌿🌙",
      title: "The Universe of Peace",
      description: "Floating planets, gentle light and silent oceans create a universe where your mind can rest."
    },

    Lonely: {
      emoji: "🌙✨",
      title: "The Universe of Silence",
      description: "You are surrounded by distant stars. Even when you feel alone, you are part of something enormous."
    },

    Hopeful: {
      emoji: "🚀🌟",
      title: "The Universe of Possibilities",
      description: "New stars are being born. Your universe is expanding toward new beginnings and unexplored worlds."
    }

  };

  const universe = universes[selectedMood];

  document.getElementById("universe").innerText = universe.emoji;
  document.getElementById("title").innerText = universe.title;
  document.getElementById("description").innerText = universe.description;

  document.getElementById("result").style.display = "block";

}

</script>

</body>
</html>
